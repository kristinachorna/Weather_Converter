<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Temperature Converter</title>
  <style>
    /* CSS Styling */
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(to right, #74ebd5, #ACB6E5);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .container {
      background-color: white;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 10px 20px rgba(0,0,0,0.2);
      text-align: center;
    }

    input {
      padding: 10px;
      margin: 10px;
      width: 150px;
      border-radius: 5px;
      border: 1px solid #ccc;
      text-align: center;
      font-size: 16px;
    }

    h1 {
      margin-bottom: 20px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Temperature Converter</h1>
    <div class="converter">
      <label for="celsius">Celsius:</label>
      <input type="number" id="celsius" placeholder="°C">
      
      <label for="fahrenheit">Fahrenheit:</label>
      <input type="number" id="fahrenheit" placeholder="°F">
    </div>
  </div>

  <script>

    // Get input elements from the DOM
    const celsiusInput = document.getElementById('celsius');
    const fahrenheitInput = document.getElementById('fahrenheit');

    // Function to convert Celsius to Fahrenheit
    function celsiusToFahrenheit(celsius) {
      return (celsius * 1.8 + 32).toFixed(2);
    }

    // Function to convert Fahrenheit to Celsius
    function fahrenheitToCelsius(fahrenheit) {
      return ((fahrenheit - 32) / 1.8).toFixed(2);
    }

    // Event listener: When user types in Celsius box
    celsiusInput.addEventListener('input', () => {
      if (celsiusInput.value !== '') {
        fahrenheitInput.value = celsiusToFahrenheit(parseFloat(celsiusInput.value));
      } else {
        fahrenheitInput.value = '';
      }
    });

    // Event listener: When user types in Fahrenheit box
    fahrenheitInput.addEventListener('input', () => {
      if (fahrenheitInput.value !== '') {
        celsiusInput.value = fahrenheitToCelsius(parseFloat(fahrenheitInput.value));
      } else {
        celsiusInput.value = '';
      }
    });
  </script>
</body>
</html>
